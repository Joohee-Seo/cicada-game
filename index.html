<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여름날의 매미 잡기 대작전!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a252f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Malgun Gothic', 'Arial', sans-serif;
            overflow: hidden;
        }
        
        /* 모바일 전체 화면 맞춤 래퍼 */
        #game-scaler {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 520px;
            background: linear-gradient(to bottom, #FFFDE7, #FFF9C4);
            border: 5px solid #5D4037;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            cursor: crosshair;
            transform-origin: center center;
            flex-shrink: 0;
        }

        /* 세 그루 풍성한 나무 */
        .tree-container {
            position: absolute;
            bottom: 50px;
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 0 10px;
            pointer-events: none;
        }
        .tree {
            position: relative;
            width: 220px;
            height: 340px;
        }
        .tree-leaves {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 220px;
            background: #4CAF50;
            border-radius: 50% 50% 45% 45%;
            box-shadow: inset -15px -15px 0 #388E3C, inset 15px 15px 0 #81C784;
        }
        .tree-leaves::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 30px;
            width: 140px;
            height: 140px;
            background: #43A047;
            border-radius: 50%;
        }
        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 150px;
            background: #795548;
            border-radius: 8px 8px 0 0;
            box-shadow: inset -8px 0 0 #5D4037;
        }

        /* 매미 그래픽 (SVG 기반) */
        .cicada {
            position: absolute;
            width: 48px;
            height: 48px;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.1s;
        }
        .cicada:hover {
            transform: scale(1.15);
        }
        .cicada-crying {
            animation: shake 0.15s infinite alternate;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -1px) rotate(2deg); }
        }

        /* 매미 울음 표시 (맴맴) */
        .cry-text {
            position: absolute;
            font-size: 13px;
            font-weight: bold;
            color: #E65100;
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid #FF9800;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 12;
        }

        /* 매미 오줌 (물방울) */
        .pee {
            position: absolute;
            width: 8px;
            height: 14px;
            background: #29B6F6;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            box-shadow: 0 0 6px #03A9F4;
            z-index: 8;
            pointer-events: none;
        }

        /* 잠자리채 휘두르기 효과 */
        .net-swing {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 4px solid #FF9800;
            border-radius: 50%;
            background: rgba(255, 235, 59, 0.3);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            animation: swingAnim 0.25s forwards;
            z-index: 15;
        }
        @keyframes swingAnim {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }

        /* 점수 & 경고 팝업 */
        .pop-text {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 15;
            text-shadow: 1px 1px 2px white;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-35px); }
        }

        /* 하단 플레이어 & 채집통 */
        #player-container {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 6;
            transition: left 0.08s linear;
        }
        #cage { 
            font-size: 42px; 
            transition: transform 0.1s;
        }
        #player { 
            font-size: 60px; 
            position: relative;
        }
        
        /* 잠자리채 사거리 가이드 원 */
        #range-indicator {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 380px;
            border: 2px dashed rgba(255, 152, 0, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }

        /* 상단 UI 바 - 모바일 레이아웃 최적화 */
        #ui-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            color: #2C3E50;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
            border-bottom: 2px solid #E0E0E0;
            white-space: nowrap;
        }
        #hp-bar-bg {
            width: 120px;
            height: 18px;
            background: #E0E0E0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #757575;
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
        }
        #hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #66BB6A, #43A047);
            transition: width 0.2s;
        }

        /* 이동 조작 버튼 - 큰 터치 영역 */
        #controls-guide {
            position: absolute;
            bottom: 12px;
            right: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            background: #FF9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #E65100;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #E65100;
        }

        /* 시작 & 결과 화면 오버레이 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .start-btn {
            padding: 16px 45px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #FF7043, #F4511E);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #BF360C;
            transition: transform 0.1s;
            margin-bottom: 15px;
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #BF360C;
        }
        .score-info-box {
            position: absolute;
            bottom: 15px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .score-badge {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 20px;
            border: 2px solid #FFA726;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        #audio-status {
            font-size: 13px;
            color: #2E7D32;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-scaler">
    <div id="game-container" onclick="handleMissClick(event)">
        <!-- UI Bar -->
        <div id="ui-bar">
            <div>점수: <span id="score" style="color: #E65100;">0</span>점 | 남은 시간: <span id="timer" style="color: #1976D2;">30</span>초</div>
            <div>
                체력: 
                <div id="hp-bar-bg">
                    <div id="hp-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- 배경 나무 세 그루 -->
        <div class="tree-container">
            <div class="tree" id="tree1"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
            <div class="tree" id="tree2"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
            <div class="tree" id="tree3"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
        </div>

        <!-- 사거리 원 표시 -->
        <div id="range-indicator"></div>

        <!-- 하단 플레이어 & 채집통 -->
        <div id="player-container">
            <div id="cage" title="채집통">🗑️</div>
            <div id="player" title="나 (A/D 키 또는 버튼으로 이동)">👨‍🌾</div>
        </div>

        <!-- 이동 버튼 -->
        <div id="controls-guide">
            <button class="ctrl-btn" onclick="movePlayer(-40); event.stopPropagation();" ontouchstart="movePlayer(-40); event.stopPropagation();">◀ A (좌)</button>
            <button class="ctrl-btn" onclick="movePlayer(40); event.stopPropagation();" ontouchstart="movePlayer(40); event.stopPropagation();">D (우) ▶</button>
        </div>

        <!-- 시작 화면 -->
        <div id="start-overlay" class="overlay">
            <h1 style="color: #2E7D32; margin-bottom: 8px; font-size: 32px; text-shadow: 2px 2px 4px white;">여름날의 매미 잡기 대작전!</h1>
            <p style="color: #444; margin-bottom: 20px; font-weight: bold; font-size: 14px;">하단 ◀A / D▶ 버튼을 눌러 이동하며 매미 오줌을 피하세요!</p>
            
            <button class="start-btn" onclick="startGame()">START</button>
            
            <div id="audio-status">🔊 '매미5.wav' 파일 소리 자동 연결 중...</div>

            <!-- 하단 최고 기록 및 최희귀 매미 -->
            <div class="score-info-box">
                <div class="score-badge">🏆 최고점: <span id="best-score">0</span>점</div>
                <div class="score-badge">✨ 최희귀: <span id="best-rare-cicada">없음</span></div>
            </div>
        </div>

        <!-- 결과 화면 (게임 오버) -->
        <div id="gameover-overlay" class="overlay" style="display: none;">
            <h1 id="gameover-title" style="color: #D32F2F; font-size: 36px; margin-bottom: 10px;">게임 종료!</h1>
            <p style="font-size: 22px; font-weight: bold; color: #333; margin-bottom: 5px;">획득 점수: <span id="final-score" style="color: #E65100;">0</span>점</p>
            <p style="font-size: 15px; color: #666; margin-bottom: 15px;" id="rare-caught-info"></p>
            <p style="font-size: 14px; color: #888; margin-bottom: 15px;"><span id="countdown-sec">5</span>초 후 초기 화면으로 이동합니다...</p>
            <button class="start-btn" style="font-size: 20px; padding: 10px 30px;" onclick="resetToStart()">다시 하기</button>
        </div>
    </div>
</div>

<script>
    // --- 0. 모바일 자동 화면 크기 맞춤 (Auto-Scaling) ---
    function fitGameToScreen() {
        const container = document.getElementById('game-container');
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        
        // 800x520 비율 유지하며 모바일 화면에 100% 맞추기
        const scaleX = windowWidth / 800;
        const scaleY = windowHeight / 520;
        const scale = Math.min(scaleX, scaleY, 1);
        
        container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', fitGameToScreen);
    window.addEventListener('orientationchange', fitGameToScreen);
    document.addEventListener('DOMContentLoaded', fitGameToScreen);
    fitGameToScreen();

    // --- 1. 매미 데이터베이스 ---
    const CICADA_TYPES = [
        { name: "참매미", score: 1, prob: 0.30, rarity: 1, color: "#8D6E63", wing: "rgba(255,255,255,0.7)", eye: "#3E2723", pattern: "none", scale: 1.0 },
        { name: "말매미", score: 1, prob: 0.30, rarity: 1, color: "#4E342E", wing: "rgba(255,255,255,0.7)", eye: "#1A237E", pattern: "none", scale: 1.1 },
        { name: "애매미", score: 2, prob: 0.30, rarity: 2, color: "#212121", wing: "rgba(255,255,255,0.8)", eye: "#000000", pattern: "spots", scale: 0.9 },
        { name: "쓰름매미", score: 3, prob: 0.04, rarity: 3, color: "#37474F", wing: "rgba(215,204,200,0.8)", eye: "#D32F2F", pattern: "none", scale: 0.95 },
        { name: "유지매미", score: 3, prob: 0.04, rarity: 3, color: "#4E342E", wing: "rgba(161,136,127,0.9)", eye: "#C62828", pattern: "none", scale: 0.95 },
        { name: "풀매미", score: 5, prob: 0.01, rarity: 4, color: "#2E7D32", wing: "rgba(200,230,201,0.8)", eye: "#1B5E20", pattern: "none", scale: 0.6 },
        { name: "17년매미", score: 5, prob: 0.01, rarity: 4, color: "#111111", wing: "rgba(255,224,178,0.8)", eye: "#FF3D00", pattern: "none", scale: 0.6 }
    ];

    const TREE_POSITIONS = [
        { x: 130, top: 180, bottom: 350 },
        { x: 400, top: 180, bottom: 350 },
        { x: 670, top: 180, bottom: 350 }
    ];

    // --- 2. 상태 변수 ---
    let score = 0;
    let hp = 100;
    let timeLeft = 30;
    let isPlaying = false;
    let playerX = 400;
    let activeCicadas = [];
    let gameTimer = null;
    let peeTimer = null;
    let cryTimer = null;
    let countdownInterval = null;
    let bestScore = localStorage.getItem('cicada_best_score') || 0;
    let bestRareLevel = parseInt(localStorage.getItem('cicada_best_rare_level')) || 0;
    let bestRareName = localStorage.getItem('cicada_best_rare_name') || '없음';

    // --- 3. 오디오 관리 (매미5.wav 자동 연동) ---
    let cicadaAudio = new Audio('매미5.wav');
    let isFileAudioLoaded = false;

    cicadaAudio.addEventListener('canplaythrough', () => {
        isFileAudioLoaded = true;
        const statusEl = document.getElementById('audio-status');
        if (statusEl) statusEl.innerText = "🎵 '매미5.wav' 소리가 완벽하게 연결되었습니다!";
    });

    cicadaAudio.addEventListener('error', () => {
        const statusEl = document.getElementById('audio-status');
        if (statusEl) statusEl.innerText = "🔊 기본 매미 음향이 준비되었습니다.";
    });

    function playCicadaSound() {
        if (isFileAudioLoaded) {
            const soundClone = cicadaAudio.cloneNode();
            soundClone.volume = 0.85;
            soundClone.play().catch(e => console.log(e));
        } else {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(4200, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }
    }

    document.getElementById('best-score').innerText = bestScore;
    document.getElementById('best-rare-cicada').innerText = bestRareName;

    // --- 4. 조작 (A/D 키 및 화면 터치) ---
    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
            movePlayer(-30);
        } else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
            movePlayer(30);
        }
    });

    function movePlayer(dir) {
        playerX = Math.max(120, Math.min(680, playerX + dir));
        const pContainer = document.getElementById('player-container');
        pContainer.style.left = playerX + 'px';
    }

    // --- 5. 게임 시작 / 리셋 ---
    function startGame() {
        fitGameToScreen();
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('gameover-overlay').style.display = 'none';
        
        score = 0;
        hp = 100;
        timeLeft = 30;
        playerX = 400;
        isPlaying = true;

        updateUI();
        movePlayer(0);
        clearAllCicadas();

        for (let i = 0; i < 5; i++) {
            spawnCicada();
        }

        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0 || hp <= 0) {
                endGame();
            }
        }, 1000);

        peeTimer = setInterval(dropPee, 1200);

        cryTimer = setInterval(() => {
            activeCicadas.forEach(c => {
                if (Math.random() < 0.35) {
                    triggerCicadaCry(c);
                }
            });
        }, 1000);
    }

    // --- 6. 매미 생성 ---
    function spawnCicada() {
        if (!isPlaying && activeCicadas.length >= 5) return;

        const rand = Math.random();
        let cumulative = 0;
        let selectedType = CICADA_TYPES[0];
        for (let type of CICADA_TYPES) {
            cumulative += type.prob;
            if (rand <= cumulative) {
                selectedType = type;
                break;
            }
        }

        const tree = TREE_POSITIONS[Math.floor(Math.random() * TREE_POSITIONS.length)];
        const x = tree.x + (Math.random() * 60 - 30);
        const y = tree.top + Math.random() * (tree.bottom - tree.top);

        const cicadaEl = document.createElement('div');
        cicadaEl.className = 'cicada';
        cicadaEl.style.left = (x - 24) + 'px';
        cicadaEl.style.top = (y - 24) + 'px';
        cicadaEl.style.transform = `scale(${selectedType.scale})`;

        const patternSVG = selectedType.pattern === 'spots' 
            ? `<circle cx="20" cy="24" r="2" fill="white"/><circle cx="28" cy="28" r="2" fill="white"/>` 
            : '';

        cicadaEl.innerHTML = `
            <svg width="48" height="48" viewBox="0 0 48 48">
                <ellipse cx="16" cy="26" rx="8" ry="18" fill="${selectedType.wing}" transform="rotate(-25 16 26)"/>
                <ellipse cx="32" cy="26" rx="8" ry="18" fill="${selectedType.wing}" transform="rotate(25 32 26)"/>
                <ellipse cx="24" cy="24" rx="10" ry="16" fill="${selectedType.color}"/>
                ${patternSVG}
                <circle cx="20" cy="12" r="3" fill="${selectedType.eye}"/>
                <circle cx="28" cy="12" r="3" fill="${selectedType.eye}"/>
            </svg>
        `;

        const cicadaData = {
            id: Date.now() + Math.random(),
            el: cicadaEl,
            type: selectedType,
            x: x,
            y: y,
            flyTimeout: null
        };

        cicadaEl.onclick = (e) => {
            e.stopPropagation();
            catchCicada(cicadaData);
        };
        cicadaEl.ontouchstart = (e) => {
            e.stopPropagation();
            catchCicada(cicadaData);
        };

        const stayTime = (Math.floor(Math.random() * 6) + 5) * 1000;
        cicadaData.flyTimeout = setTimeout(() => {
            flyAway(cicadaData);
        }, stayTime);

        document.getElementById('game-container').appendChild(cicadaEl);
        activeCicadas.push(cicadaData);
    }

    function triggerCicadaCry(cicada) {
        cicada.el.classList.add('cicada-crying');
        playCicadaSound();

        const cryEl = document.createElement('div');
        cryEl.className = 'cry-text';
        cryEl.innerText = '🎵 맴맴~';
        cryEl.style.left = (cicada.x - 15) + 'px';
        cryEl.style.top = (cicada.y - 25) + 'px';
        document.getElementById('game-container').appendChild(cryEl);

        setTimeout(() => { cryEl.remove(); }, 800);
        setTimeout(() => { cicada.el.classList.remove('cicada-crying'); }, 600);
    }

    function flyAway(cicada) {
        const index = activeCicadas.findIndex(c => c.id === cicada.id);
        if (index !== -1) {
            activeCicadas.splice(index, 1);
            cicada.el.style.transition = 'all 0.8s ease-in';
            cicada.el.style.top = '-60px';
            cicada.el.style.opacity = '0';
            setTimeout(() => {
                cicada.el.remove();
                if (isPlaying) spawnCicada();
            }, 800);
        }
    }

    // --- 7. 매미 잡기 ---
    function catchCicada(cicada) {
        if (!isPlaying) return;

        const dist = Math.hypot(cicada.x - playerX, cicada.y - 420);
        showNetSwing(cicada.x, cicada.y);

        if (dist > 200) {
            showPopText("너무 멀어요! 이동하세요", cicada.x, cicada.y, "#D32F2F");
            return;
        }

        clearTimeout(cicada.flyTimeout);
        const index = activeCicadas.findIndex(c => c.id === cicada.id);
        if (index !== -1) activeCicadas.splice(index, 1);

        score += cicada.type.score;
        updateUI();
        showPopText(`+${cicada.type.score}점! (${cicada.type.name})`, cicada.x, cicada.y, "#2E7D32");

        if (cicada.type.rarity > bestRareLevel) {
            bestRareLevel = cicada.type.rarity;
            bestRareName = cicada.type.name;
            localStorage.setItem('cicada_best_rare_level', bestRareLevel);
            localStorage.setItem('cicada_best_rare_name', bestRareName);
            document.getElementById('best-rare-cicada').innerText = bestRareName;
        }

        cicada.el.style.transition = 'all 0.3s ease-in';
        cicada.el.style.left = (playerX - 35) + 'px';
        cicada.el.style.top = '440px';
        cicada.el.style.transform = 'scale(0.2)';

        const cage = document.getElementById('cage');
        cage.style.transform = 'scale(1.2) rotate(-10deg)';
        setTimeout(() => { cage.style.transform = 'scale(1) rotate(0deg)'; }, 200);

        setTimeout(() => {
            cicada.el.remove();
            if (isPlaying) spawnCicada();
        }, 300);
    }

    function handleMissClick(e) {
        if (!isPlaying) return;
        const rect = document.getElementById('game-container').getBoundingClientRect();
        
        // 터치 및 마우스 좌표 정밀 계산
        const scale = parseFloat(document.getElementById('game-container').style.transform.replace('scale(', '').replace(')', '')) || 1;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const clickX = (clientX - rect.left) / scale;
        const clickY = (clientY - rect.top) / scale;

        showNetSwing(clickX, clickY);
        score = Math.max(0, score - 2);
        updateUI();
        showPopText("-2점!", clickX, clickY, "#D32F2F");
    }

    // --- 8. 매미 오줌 공격 ---
    function dropPee() {
        if (!isPlaying || activeCicadas.length === 0) return;

        const shooter = activeCicadas[Math.floor(Math.random() * activeCicadas.length)];
        const pee = document.createElement('div');
        pee.className = 'pee';
        pee.style.left = shooter.x + 'px';
        pee.style.top = shooter.y + 'px';
        document.getElementById('game-container').appendChild(pee);

        let peeY = shooter.y;
        const fallInterval = setInterval(() => {
            peeY += 7;
            pee.style.top = peeY + 'px';

            if (peeY >= 420 && peeY <= 470) {
                if (Math.abs(shooter.x - playerX) < 50) {
                    clearInterval(fallInterval);
                    pee.remove();
                    takeDamage(5);
                }
            }

            if (peeY > 500) {
                clearInterval(fallInterval);
                pee.remove();
            }
        }, 30);
    }

    function takeDamage(amount) {
        hp = Math.max(0, hp - amount);
        updateUI();

        const player = document.getElementById('player');
        player.style.opacity = '0.3';
        setTimeout(() => { player.style.opacity = '1'; }, 150);

        if (hp <= 0) endGame();
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('hp-bar-fill').style.width = hp + '%';
    }

    function showPopText(text, x, y, color) {
        const pop = document.createElement('div');
        pop.className = 'pop-text';
        pop.innerText = text;
        pop.style.left = (x - 30) + 'px';
        pop.style.top = (y - 20) + 'px';
        pop.style.color = color;
        document.getElementById('game-container').appendChild(pop);
        setTimeout(() => { pop.remove(); }, 800);
    }

    function showNetSwing(x, y) {
        const swing = document.createElement('div');
        swing.className = 'net-swing';
        swing.style.left = x + 'px';
        swing.style.top = y + 'px';
        document.getElementById('game-container').appendChild(swing);
        setTimeout(() => { swing.remove(); }, 250);
    }

    function clearAllCicadas() {
        activeCicadas.forEach(c => c.el.remove());
        activeCicadas = [];
    }

    // --- 9. 게임 종료 ---
    function endGame() {
        isPlaying = false;
        clearInterval(gameTimer);
        clearInterval(peeTimer);
        clearInterval(cryTimer);

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('cicada_best_score', bestScore);
            document.getElementById('best-score').innerText = bestScore;
        }

        document.getElementById('final-score').innerText = score;
        document.getElementById('rare-caught-info').innerText = `🏆 이번 기록 최고 희귀 매미: ${bestRareName}`;
        document.getElementById('gameover-overlay').style.display = 'flex';

        let count = 5;
        document.getElementById('countdown-sec').innerText = count;
        countdownInterval = setInterval(() => {
            count--;
            document.getElementById('countdown-sec').innerText = count;
            if (count <= 0) {
                clearInterval(countdownInterval);
                resetToStart();
            }
        }, 1000);
    }

    function resetToStart() {
        clearInterval(countdownInterval);
        document.getElementById('gameover-overlay').style.display = 'none';
        document.getElementById('start-overlay').style.display = 'flex';
        clearAllCicadas();
    }
</script>

</body>
</html>
