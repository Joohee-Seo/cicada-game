<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여름날의 매미 잡기 대작전!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            font-family: 'Malgun Gothic', 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-scaler {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to bottom, #FFFDE7, #FFF9C4);
            border: 4px solid #333;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform-origin: center center;
            flex-shrink: 0;
        }

        .tree-group {
            position: absolute;
            bottom: 45px;
            width: 26%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        #tree1 { left: 5%; }
        #tree2 { left: 37%; }
        #tree3 { left: 69%; }

        .tree-top {
            width: 100%;
            height: 140px;
            background: #4CAF50;
            border-radius: 50%;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
            position: relative;
        }
        .tree-top::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 15%;
            width: 70%;
            height: 110px;
            background: #66BB6A;
            border-radius: 50%;
        }
        .tree-trunk {
            width: 32px;
            height: 130px;
            background: #795548;
            border-radius: 4px;
            box-shadow: inset -4px 0 0 rgba(0,0,0,0.2);
        }

        .cicada {
            position: absolute;
            width: 44px;
            height: 44px;
            cursor: pointer;
            z-index: 8;
            transition: transform 0.1s;
        }
        .cicada:hover {
            transform: scale(1.15);
        }
        .cicada-label {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 1px 5px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
        }
        .sing-note {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #E91E63;
            animation: floatUp 0.8s forwards;
            white-space: nowrap;
        }

        .pee {
            position: absolute;
            width: 10px;
            height: 16px;
            background: #29B6F6;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            z-index: 9;
            pointer-events: none;
        }

        #player-wrapper {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            transition: left 0.08s ease-out;
            pointer-events: none;
            z-index: 10;
        }
        #cage { font-size: 38px; margin-right: 5px; }
        #player { font-size: 52px; transform: scaleX(-1); }

        #net-swing {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid #FF9800;
            border-radius: 50%;
            background: rgba(255, 152, 0, 0.2);
            pointer-events: none;
            display: none;
            z-index: 15;
            transform: translate(-50%, -50%);
            animation: ping 0.2s linear;
        }

        #ui-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            color: #333;
            background: rgba(255, 255, 255, 0.85);
            z-index: 12;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #hp-bar-bg {
            width: 110px;
            height: 16px;
            background: #ddd;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #555;
            display: inline-block;
            vertical-align: middle;
        }
        #hp-bar-fill {
            width: 100%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.2s;
        }

        #controls-bar {
            position: absolute;
            bottom: 8px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 12;
        }
        .ctrl-btn {
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: #FF9800;
            border: 2px solid #E65100;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #E65100;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #E65100;
        }

        #start-overlay, #end-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 15px;
            text-align: center;
        }
        #start-btn, #restart-btn {
            padding: 12px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: #4CAF50;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #2E7D32;
            margin-top: 10px;
        }
        #start-btn:active, #restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2E7D32;
        }
        .info-card {
            font-size: 14px;
            color: #444;
            background: #FFF;
            padding: 10px 18px;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            line-height: 1.6;
        }

        .score-popup {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
            z-index: 15;
            animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
        @keyframes ping {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-scaler">
    <div id="game-container">
        <!-- UI 상단바 -->
        <div id="ui-bar">
            <div>점수: <span id="score" style="color:#D32F2F;">0</span>점 | 시간: <span id="timer" style="color:#1976D2;">30</span>초</div>
            <div>
                체력: 
                <div id="hp-bar-bg">
                    <div id="hp-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- 배경 나무 3그루 -->
        <div class="tree-group" id="tree1">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree-group" id="tree2">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree-group" id="tree3">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
        </div>

        <!-- 잠자리채 휘두르기 이펙트 -->
        <div id="net-swing"></div>

        <!-- 하단 플레이어 & 채집통 -->
        <div id="player-wrapper">
            <div id="cage" title="채집통">🗑️</div>
            <div id="player" title="나">👨‍🌾</div>
        </div>

        <!-- 이동 조작 버튼 -->
        <div id="controls-bar">
            <button class="ctrl-btn" onclick="movePlayer(-30)" ontouchstart="movePlayer(-30); event.preventDefault();">◀ A</button>
            <button class="ctrl-btn" onclick="movePlayer(30)" ontouchstart="movePlayer(30); event.preventDefault();">D ▶</button>
        </div>

        <!-- 초기 화면 오버레이 -->
        <div id="start-overlay">
            <h1 style="color: #2E7D32; margin: 0 0 10px 0; font-size: 28px;">🌳 여름날의 매미 잡기!</h1>
            <button id="start-btn" onclick="startGame()">START</button>
            
            <div id="audio-status" style="font-size: 13px; color: #2E7D32; margin-top: 10px; font-weight: bold;">
                🔊 '매미5.wav' 음원 연결 중...
            </div>

            <div class="info-card">
                🏆 최고 점수: <span id="best-score" style="font-weight:bold; color:#D32F2F;">0</span>점<br>
                ✨ 가장 희귀한 채집 매미: <span id="best-rarity" style="font-weight:bold; color:#1976D2;">없음</span>
            </div>
            <div style="font-size: 12px; color: #666; margin-top: 10px;">
                A/D 키나 하단 버튼으로 움직여 매미 오줌을 피하세요!
            </div>
        </div>

        <!-- 결과 오버레이 -->
        <div id="end-overlay" style="display: none;">
            <h2 id="end-title" style="color: #D32F2F; margin-bottom: 5px;">게임 종료!</h2>
            <p id="end-score-text" style="font-size: 18px; font-weight: bold; margin: 5px 0;"></p>
            <p id="end-rare-text" style="font-size: 14px; color: #388E3C; margin: 5px 0;"></p>
            <button id="restart-btn" onclick="startGame()">다시 하기</button>
            <div id="countdown-text" style="font-size: 12px; color: #777; margin-top: 10px;">5초 후 초기 화면으로 이동합니다...</div>
        </div>
    </div>
</div>

<script>
    function fitGameToScreen() {
        const container = document.getElementById('game-container');
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        
        const scaleX = windowWidth / 800;
        const scaleY = windowHeight / 500;
        const scale = Math.min(scaleX, scaleY, 1);
        
        container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', fitGameToScreen);
    window.addEventListener('orientationchange', fitGameToScreen);
    document.addEventListener('DOMContentLoaded', fitGameToScreen);
    fitGameToScreen();

    let score = 0;
    let hp = 100;
    let timeLeft = 30;
    let gameActive = false;
    let gameTimer = null;
    let peeTimer = null;
    let singTimer = null;
    let countdownTimer = null;
    
    let playerPosX = 50;
    let caughtRarestIndex = -1;
    
    const rarityNames = ["없음", "참매미/말매미 (일반)", "애매미 (희귀)", "쓰름매미/유지매미 (영웅)", "17년매미/풀매미 (전설)"];

    const cicadaTypes = [
        { name: "참매미", score: 1, prob: 0.30, rarityRank: 1, color: "#8D6E63", wings: "rgba(255,255,255,0.7)", size: 40 },
        { name: "말매미", score: 1, prob: 0.30, rarityRank: 1, color: "#5D4037", wings: "rgba(255,255,255,0.7)", size: 42 },
        { name: "애매미", score: 2, prob: 0.30, rarityRank: 2, color: "#37474F", spot: "white", wings: "rgba(255,255,255,0.8)", size: 36 },
        { name: "쓰름매미", score: 3, prob: 0.04, rarityRank: 3, color: "#212121", eyes: "red", wings: "#A1887F", size: 38 },
        { name: "유지매미", score: 3, prob: 0.04, rarityRank: 3, color: "#3E2723", eyes: "red", wings: "#8D6E63", size: 38 },
        { name: "풀매미", score: 5, prob: 0.01, rarityRank: 4, color: "#4CAF50", wings: "rgba(200,230,201,0.8)", size: 26 },
        { name: "17년매미", score: 5, prob: 0.01, rarityRank: 4, color: "#111111", wings: "rgba(255,224,178,0.8)", size: 24 }
    ];

    // 모바일 URL 안전 한글 인코딩 처리
    const audioPath = encodeURI('매미5.wav');
    let audioFile = new Audio(audioPath);
    let isFileAudioLoaded = false;
    let audioUnlocked = false;

    audioFile.addEventListener('canplaythrough', () => {
        isFileAudioLoaded = true;
        const statusEl = document.getElementById('audio-status');
        if (statusEl) statusEl.innerText = "🎵 '매미5.wav' 음원이 제대로 연결되었습니다!";
    });

    audioFile.addEventListener('error', () => {
        const statusEl = document.getElementById('audio-status');
        if (statusEl) statusEl.innerText = "🔊 매미 소리가 준비되었습니다.";
    });

    // 스마트폰 전용 오디오 터치 강제 해제 (Autoplay Policy 해제)
    function unlockMobileAudio() {
        if (!audioUnlocked && audioFile) {
            audioFile.play().then(() => {
                audioFile.pause();
                audioFile.currentTime = 0;
                audioUnlocked = true;
                isFileAudioLoaded = true;
            }).catch(e => {
                console.log("Mobile audio unlock:", e);
            });
        }
    }

    // 모바일 전역 터치 이벤트로 오디오 해제
    window.addEventListener('touchstart', unlockMobileAudio, { once: true });
    window.addEventListener('click', unlockMobileAudio, { once: true });

    function playCicadaSound() {
        try {
            const sound = new Audio(audioPath);
            sound.volume = 0.85;
            sound.play().catch(() => playSynthSound());
        } catch (e) {
            playSynthSound();
        }
    }

    function playSynthSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(4200, ctx.currentTime);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } catch(e) {}
    }

    let bestScore = localStorage.getItem('cicada_best_score') || 0;
    let bestRarest = localStorage.getItem('cicada_best_rarity') || 0;
    document.getElementById('best-score').innerText = bestScore;
    document.getElementById('best-rarity').innerText = rarityNames[bestRarest] || "없음";

    function createCicadaSVG(type) {
        const eyesColor = type.eyes || "#111";
        const spotMarkup = type.spot ? `<circle cx="16" cy="22" r="3" fill="${type.spot}"/><circle cx="24" cy="22" r="3" fill="${type.spot}"/>` : '';
        return `
            <svg width="${type.size}" height="${type.size}" viewBox="0 0 40 40">
                <ellipse cx="12" cy="24" rx="7" ry="14" fill="${type.wings}" transform="rotate(-20 12 24)"/>
                <ellipse cx="28" cy="24" rx="7" ry="14" fill="${type.wings}" transform="rotate(20 28 24)"/>
                <ellipse cx="20" cy="22" rx="9" ry="13" fill="${type.color}"/>
                ${spotMarkup}
                <circle cx="14" cy="12" r="3" fill="${eyesColor}"/>
                <circle cx="26" cy="12" r="3" fill="${eyesColor}"/>
            </svg>
        `;
    }

    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') movePlayer(-6);
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') movePlayer(6);
    });

    function movePlayer(deltaPercent) {
        playerPosX = Math.max(8, Math.min(92, playerPosX + deltaPercent));
        document.getElementById('player-wrapper').style.left = playerPosX + '%';
    }

    document.getElementById('game-container').addEventListener('click', (e) => {
        if (!gameActive) return;
        if (e.target.closest('.cicada') || e.target.closest('#controls-bar') || e.target.closest('#start-overlay')) return;

        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const scale = parseFloat(document.getElementById('game-container').style.transform.replace('scale(', '').replace(')', '')) || 1;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const clickX = (clientX - containerRect.left) / scale;
        const clickY = (clientY - containerRect.top) / scale;

        showSwing(clickX, clickY);
        score = Math.max(0, score - 2);
        updateUI();
        showPopup(clickX, clickY, "-2점 (허공!)", "#D32F2F");
    });

    function showSwing(x, y) {
        const swing = document.getElementById('net-swing');
        swing.style.left = x + 'px';
        swing.style.top = y + 'px';
        swing.style.display = 'block';
        setTimeout(() => swing.style.display = 'none', 200);
    }

    function startGame() {
        fitGameToScreen();
        unlockMobileAudio();

        score = 0;
        hp = 100;
        timeLeft = 30;
        gameActive = true;
        caughtRarestIndex = -1;
        playerPosX = 50;
        document.getElementById('player-wrapper').style.left = '50%';

        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('end-overlay').style.display = 'none';
        
        clearInterval(gameTimer);
        clearInterval(peeTimer);
        clearInterval(singTimer);
        clearInterval(countdownTimer);

        document.querySelectorAll('.cicada').forEach(c => c.remove());
        for (let i = 0; i < 5; i++) spawnCicada();

        gameTimer = setInterval(() => {
            timeLeft--;
            updateUI();
            if (timeLeft <= 0) endGame("⏰ 시간 종료!");
        }, 1000);

        peeTimer = setInterval(dropPee, 1200);
        singTimer = setInterval(trySing, 1000);

        updateUI();
    }

    function getRandomCicadaType() {
        const rand = Math.random();
        let cumulative = 0;
        for (let type of cicadaTypes) {
            cumulative += type.prob;
            if (rand <= cumulative) return type;
        }
        return cicadaTypes[0];
    }

    function spawnCicada() {
        if (!gameActive) return;
        const container = document.getElementById('game-container');
        const trees = [document.getElementById('tree1'), document.getElementById('tree2'), document.getElementById('tree3')];
        const targetTree = trees[Math.floor(Math.random() * trees.length)];
        
        const type = getRandomCicadaType();
        const cicada = document.createElement('div');
        cicada.className = 'cicada';
        cicada.dataset.score = type.score;
        cicada.dataset.name = type.name;
        cicada.dataset.rarityRank = type.rarityRank;
        cicada.innerHTML = `${createCicadaSVG(type)}<div class="cicada-label">${type.name}</div>`;

        const treeRect = targetTree.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        
        const xMin = treeRect.left - containerRect.left;
        const xMax = xMin + treeRect.width - 40;
        const posX = xMin + Math.random() * (xMax - xMin);
        const posY = 50 + Math.random() * 90;

        cicada.style.left = posX + 'px';
        cicada.style.top = posY + 'px';

        const catchHandler = (e) => {
            e.stopPropagation();
            if (!gameActive) return;

            const containerWidth = containerRect.width;
            const playerPixelX = (playerPosX / 100) * containerWidth;
            const dist = Math.abs(playerPixelX - (posX + 20));

            showSwing(posX + 20, posY + 20);

            if (dist > 180) {
                showPopup(posX, posY, "너무 멀어요! (A/D 이동)", "#FF9800");
                return;
            }

            const gainedScore = parseInt(cicada.dataset.score);
            score += gainedScore;
            
            const rRank = parseInt(cicada.dataset.rarityRank);
            if (rRank > caughtRarestIndex) caughtRarestIndex = rRank;

            showPopup(posX, posY, `+${gainedScore}점!`, "#4CAF50");
            cicada.remove();
            updateUI();

            setTimeout(spawnCicada, 1000 + Math.random() * 2000);
        };

        cicada.addEventListener('click', catchHandler);
        cicada.addEventListener('touchstart', (e) => { e.preventDefault(); catchHandler(e); });

        container.appendChild(cicada);

        const stayTime = 5000 + Math.random() * 5000;
        setTimeout(() => {
            if (cicada.parentNode) {
                cicada.style.transition = 'transform 0.8s, opacity 0.8s';
                cicada.style.transform = 'translateY(-100px) scale(0.5)';
                cicada.style.opacity = '0';
                setTimeout(() => {
                    if (cicada.parentNode) {
                        cicada.remove();
                        spawnCicada();
                    }
                }, 800);
            }
        }, stayTime);
    }

    function dropPee() {
        if (!gameActive) return;
        const cicadas = document.querySelectorAll('.cicada');
        if (cicadas.length === 0) return;

        const shooter = cicadas[Math.floor(Math.random() * cicadas.length)];
        const posX = parseFloat(shooter.style.left) + 15;
        const posY = parseFloat(shooter.style.top) + 20;

        const container = document.getElementById('game-container');
        const pee = document.createElement('div');
        pee.className = 'pee';
        pee.style.left = posX + 'px';
        pee.style.top = posY + 'px';
        container.appendChild(pee);

        let currentY = posY;
        const dropInterval = setInterval(() => {
            currentY += 8;
            pee.style.top = currentY + 'px';

            const containerHeight = 500;
            const containerWidth = 800;
            const playerPixelX = (playerPosX / 100) * containerWidth;

            if (currentY >= containerHeight - 60) {
                if (Math.abs(posX - playerPixelX) < 45) {
                    hp = Math.max(0, hp - 5);
                    updateUI();
                    showPopup(playerPixelX, containerHeight - 80, "오줌 맞음! -5%", "#D32F2F");
                    if (hp <= 0) endGame("💔 체력 기절!");
                }
                clearInterval(dropInterval);
                pee.remove();
            }
        }, 30);
    }

    function trySing() {
        if (!gameActive) return;
        const cicadas = document.querySelectorAll('.cicada');
        cicadas.forEach(c => {
            if (Math.random() < 0.35) {
                const note = document.createElement('div');
                note.className = 'sing-note';
                note.innerText = '🎵 맴맴~';
                c.appendChild(note);
                setTimeout(() => note.remove(), 800);

                playCicadaSound();
            }
        });
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('hp-bar-fill').style.width = hp + '%';
    }

    function showPopup(x, y, text, color) {
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.innerText = text;
        popup.style.color = color;
        popup.style.left = x + 'px';
        popup.style.top = y + 'px';
        document.getElementById('game-container').appendChild(popup);
        setTimeout(() => popup.remove(), 800);
    }

    function endGame(reason) {
        gameActive = false;
        clearInterval(gameTimer);
        clearInterval(peeTimer);
        clearInterval(singTimer);

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('cicada_best_score', bestScore);
        }
        if (caughtRarestIndex > bestRarest) {
            bestRarest = caughtRarestIndex;
            localStorage.setItem('cicada_best_rarity', bestRarest);
        }

        document.getElementById('end-title').innerText = reason;
        document.getElementById('end-score-text').innerText = `최종 점수: ${score}점`;
        document.getElementById('end-rare-text').innerText = `수집한 가장 희귀한 매미: ${rarityNames[caughtRarestIndex] || "없음"}`;
        document.getElementById('end-overlay').style.display = 'flex';

        let count = 5;
        document.getElementById('countdown-text').innerText = `${count}초 후 초기 화면으로 이동합니다...`;
        countdownTimer = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('countdown-text').innerText = `${count}초 후 초기 화면으로 이동합니다...`;
            } else {
                clearInterval(countdownTimer);
                document.getElementById('end-overlay').style.display = 'none';
                document.getElementById('start-overlay').style.display = 'flex';
                document.getElementById('best-score').innerText = bestScore;
                document.getElementById('best-rarity').innerText = rarityNames[bestRarest] || "없음";
            }
        }, 1000);
    }
</script>

</body>
</html>
